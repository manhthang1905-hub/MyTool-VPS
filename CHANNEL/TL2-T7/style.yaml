audience_language: "Japanese"
audience_culture_note: "Design for Japanese psychology and self-improvement viewers aged 20-40. Use settings that evoke quiet Japanese daily life: minimalist one-room apartments with wood flooring or tatami edges, small balconies with potted plants, konbini warm light at night, empty train station platforms at dusk, quiet park benches under trees, cafe window seats on rainy afternoons, riverside walking paths, shrine stone stairs with moss. Emphasize concepts of wa (調和 inner harmony), gaman (我慢 quiet endurance), honne vs tatemae (本音と建前 inner truth vs social mask), ikigai (生きがい life purpose), wabi-sabi (侘寂 beauty in imperfection), kaizen (改善 continuous small improvement — growth as 1% daily progress, not dramatic transformation), and hansei (反省 constructive self-reflection without toxic self-criticism). Props should feel everyday and grounded: canned coffee from a vending machine, a paperback book, earbuds, a convenience store umbrella, a tote bag, a bicycle. Prefer contemplative stillness and ma (間 meaningful emptiness) over dramatic gesture. Seasons and weather are powerful emotional anchors — use rain on windows, falling ginkgo leaves, first snow on rooftops, sakura petals drifting across an empty path. Keep negative space generous and intentional."
cultural_props: "canned coffee (Boss or Georgia style) on park bench, clear vinyl convenience store umbrella, small paperback bunkobon book, white earbuds draped over collar, canvas tote bag, bicycle parked against fence, ceramic yunomi tea cup on low wooden table, folded origami crane on desk, bento box with furoshiki cloth wrap, potted succulent on windowsill, train station ticket gate, vending machine warm glow, simple wooden chopsticks on ceramic rest"
cultural_metaphors: "anxiety: rain streaking down a cafe window while the reference character sits alone watching drops with hands around a warm cup | stress: too many sticky notes and papers scattered across a small desk while the reference character sits head slightly bowed | boundary: the reference character gently closes a sliding fusuma door creating a soft paper partition | connection: two yunomi tea cups steaming side by side on a low wooden table in warm light | letting_go: the reference character releases a small paper boat into a quiet stream from a wooden bridge railing | loneliness: the reference character sits on a konbini window counter stool at night, empty seat beside, rain outside | growth: a small potted plant on a windowsill catching morning sunlight while the reference character waters it | courage: the reference character steps through a torii gate onto a misty forest path, hands relaxed at sides | acceptance: the reference character sits on a park bench watching autumn ginkgo leaves drift down peacefully | forgiveness: the reference character places a folded origami crane on a quiet shrine step and bows head slightly | burnout: the reference character stands on an empty train platform at dusk, bag at feet, watching the last train leave | self-worth: the reference character sees own reflection in a rain puddle and the reflection smiles gently back | change: the reference character walks across a bridge at dawn with the city waking up in soft golden light behind"
cultural_emotion_style: "Japanese audiences value contemplative stillness and find meaning in silence and space (ma 間). Show psychology through seasonal nature metaphors: cherry blossoms for impermanence (mono no aware 物の哀れ), rain for melancholy and cleansing, autumn ginkgo for letting go, first snow for quiet new beginnings. Express emotion through posture restraint — a slight head bow, hands in pockets, gazing out a window, sitting alone in a familiar space. The neutral expression is a strength: viewers project their own feelings onto the understated face. Vulnerability is shown through quiet solitude in everyday spaces (empty train, cafe corner, park bench at dusk), not dramatic outbursts. Prefer stillness that speaks over movement that shouts. The concept of natsukashii (懐かしい nostalgic longing) is deeply resonant — evoke familiar daily moments that feel bittersweet and universal."
