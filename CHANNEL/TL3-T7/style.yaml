engagement_rules: "This viewer is not sad, they are resentful — do not comfort them in the picture: keep the mouth straight, the stance square, the contrast hard. Frame straight-on or crop in close, let one heavy brush object stand for the ruler being held against them, and let the orange head stay the only color so the eye lands on the thing that is doing the thinking. Thumbnail must be unmistakable beside the sibling channels: thick black brush strokes and an orange head on plain white, never a pale cream field with a thin stick figure, never a tidy cream room in navy and beige, never the old dark chalkboard."
