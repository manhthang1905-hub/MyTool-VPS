do_dai_theo_goc: false
# ── Viết 3 bản rồi chấm chọn một ──────────────────────────────────────────────
#  Chủ dự án, 25/08/2026: *"cho nó viết nhiều lần, và chấm điểm các lần tức là
#  chọn bản tốt nhất"* — rồi *"trên máy này mày cứ cho viết 5 bài"*. Máy này
#  chữ đi thuê bao Claude nên 5 bản + 1 lượt chấm không tốn thêm gì. Khách đi ví
#  để 1. Từng bản và bản chấm nằm trong thư mục lượt: 1-ban-A…E.txt,
#  1-cham-diem.txt. Tiêu chí chấm: prompt/2b-cham.md (hook, giữ chân, bám gốc,
#  CTA kéo bình luận — theo mục đích YouTube đề xuất).
#  Hạ 5 → 3 ngày 04/09/2026: chữ tiết kiệm được dồn sang bước viết hook riêng.
#  Ba bản vẫn đủ để chọn lọc; bản thứ tư, thứ năm gần như không đổi kết quả.
