#  `nhom` để `core/nhom_kenh.py` cho chúng KÉO NHAU: sổ đối thủ chung (kênh
#  nào thấy đối thủ mới thì cả nhóm cùng thấy), chống làm trùng video nguồn,
#  bảng chỉ số nhóm, và phép kiểm trùng giọng đọc/ảnh nhân vật/lời nhắc.
#
#  Không khai `nhom` thì kênh này đứng ngoài — vừa không chia dữ liệu cho ba
#  kênh em, vừa không bị kiểm khi nó trùng giọng hay trùng bìa với chúng.
nhom: "tam-ly-nhat"
tep: "nguoi-song-lech-nhip-so-dong"
