# ── Viết riêng ĐOẠN MỞ ĐẦU, chấm bằng tiêu chí riêng ─────────────────────────
#  Chủ dự án, 04/09/2026: *"bước viết hook sẽ riêng và có tiêu chí chấm riêng
#  cũng viết hook vài lần để chọn bản ok"*.
#  Đo được: bộ chấm cả bài chấm 60 giây đầu chung với thân bài nên bản mở sai
#  kiểu vẫn thắng nhờ thân bài tốt (đúng chuyện của lượt 0005). Tách riêng thì
#  hook phải tự thắng. Chạy sau cùng, dùng prompt/2d-hook.md + 2e-cham-hook.md.
so_ban_hook: 3
#  Sau khi chọn bản: vá đúng "chỗ dễ rớt" bộ chấm chỉ ra (giữ ≥90% câu, rồi bộ
