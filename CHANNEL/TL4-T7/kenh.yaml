#  đọc lên. Từ 04/09/2026 tool đo bằng chữ đọc lên (`_do_doc`), nên con số ấy
#  thừa 10%.
#
#  Đo lại 04/09/2026, chữ đọc lên chia cho phút của chính tệp 2-giong-doc.mp3:
#      0002 → 284    0004 → 258    0005 → 257    0006 → 275
#  Đối chiếu ngoài: video đối thủ 978 giây, phụ đề 4.505 ký tự → 276.
