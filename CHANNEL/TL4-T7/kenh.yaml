# ============================================================================
#  KÊNH TL4-T7 — 心理のとまり木 — tâm lý, người sống lệch nhịp
# ============================================================================
#  Tool tạo tệp này từ khuôn: ngách “Tâm lý” × bộ vẽ “Trắng trơn, nền đào ấm” × khán giả “Nhật Bản”.
#  Sửa thoải mái — từ giờ đây là tệp của bạn, khuôn không đụng vào nữa.
#
#  ⚠ `ky_tu_moi_phut` đi theo GIỌNG ĐỌC, không theo ngôn ngữ chung chung.
#  Đo 18/08/2026 trên BẢY video thật của kênh TL1-T1: 288–308, trung bình 298. Kanji chở nhiều âm nên thấp hơn hẳn tiếng châu Âu.
#  Đổi giọng đọc thì đo lại: lấy số ký tự kịch bản chia cho số phút của mp3.
#
#  ⚠ KHÔNG BAO GIỜ ĐẶT KHOÁ API VÀO ĐÂY. Tiền của luồng AUTO đi qua đúng một
#  cửa: ví ShopAPI mà tool đã đăng nhập. Tool có bộ quét, thấy khoá là chặn.
# ============================================================================

# ── Kênh RIÊNG của chủ máy (đổi 21/09/2026) ──────────────────────────────────
#  Trước đây tệp này khai `mau_cua_tool: true` — cờ nói với tool rằng đây là
#  KÊNH MẪU ship kèm bản cài, và cập nhật tool được phép GHI ĐÈ nó để khách
#  nhận bản mẫu mới hơn (xem `core/kenh.py`, mục "KÊNH MẪU CỦA TOOL hay KÊNH
#  RIÊNG CỦA KHÁCH").
#
#  Nhưng đây không còn là kênh mẫu: nó là kênh thật đang chạy, và tệp này chứa
#  những con số ĐO TAY trên video thật của chính nó — `ky_tu_moi_phut: 270`
#  (đo trên bốn lượt có giọng đọc thật), `phut_muc_tieu: 15`,
#  `chenh_cho_phep: 0.15`, `so_ban_nhap: 3`, `nhan_tieu_de: 心理学`. Một lượt
#  cập nhật là mất sạch, không hỏi ai.
#
#  `kenh_rieng: true` là cờ mà `core/safe_update` KHÔNG BAO GIỜ đụng vào.
kenh_rieng: true

# ── Thành viên nhóm "tam-ly-nhat" (21/09/2026) ───────────────────────────────
