# ── Độ dài: LUÔN về 10–15 phút, bất kể video gốc dài hay ngắn ─────────────────
#  Chủ dự án, 24/08/2026: *"kịch bản đối thủ có thể ngắn hoặc dài hơn nhưng nó
#  sẽ luôn để content của kênh về khoảng 12-15 phút"*; nhắc lại 04/09/2026:
#  *"kênh tao là khoảng 10-15 phút — nguồn thì đôi khi nó sẽ ngắn sẽ dài nên
#  không thể theo nguồn được"*. Nên KHÔNG bật `do_dai_theo_goc`.
#
#  ═══ VÌ SAO 13 → 15 (04/09/2026) ═══
#
#  Mốc cũ là 13, và 13 × 302 = 3.926 ký tự. Nhưng 302 đếm cả xuống dòng, nên
#  3.926 ký tự thật ra là 14,5 phút chứ không phải 13 — con số trong tệp này
#  không phải thứ nhận được. Đo bốn video thật: 11,9 / 14,9 / 14,8 / 15,1 phút.
#
#  Sửa nhịp về 270 mà giữ 13 thì mục tiêu tụt còn 3.510 ký tự, tức video ngắn
#  đi hơn một phút so với thứ kênh đang chạy. Chủ dự án chọn giữ nguyên chỗ
#  đang đứng và gọi đúng tên nó: 15 × 270 = 4.050 ký tự = 15,0 phút thật.
phut_muc_tieu: 15
#  Lệch bao nhiêu thì mới gọi bước nắn độ dài (prompt/4-do-dai.md).
#
#  ═══ ĐÂY GIỜ LÀ CHỖ DUY NHẤT CANH ĐỘ DÀI (04/09/2026) ═══
#
#  Bộ chấm đã bỏ tiêu chí độ dài, lời nhắc viết và lời nhắc hoàn thiện chỉ
#  còn nói một con số. Đó là đúng — nhưng khi bỏ hết cùng lúc thì không còn
#  ai canh: lượt 0008 ra 5.076 ký tự = 18,8 phút, vượt cả khoảng 11–17 của
#  chủ dự án, và lọt qua vì 0,30 cho trần tới 5.265.
#
#  0,15 quanh 4.050 = 3.443–4.658 ký tự = 12,8–17,3 phút, gần đúng khoảng
#  chủ dự án chịu được. Đối chiếu hai lượt thật: 0007 (3.864) vẫn lọt, không
#  tốn lượt gọi nào; 0008 (5.076) bị bắt, đúng ca cần bắt.
#
#  Để mọi ràng buộc độ dài ở ĐÚNG MỘT CHỖ, và là chỗ cơ học — lời nhắc viết
#  không phải gánh nó, nên nó không cướp chỗ của việc viết hay.
